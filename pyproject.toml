[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-servers"
version = "0.1.0"
description = "Python MCP server project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.27.2",
    "pydantic==2.12.5",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["task1*"]

[tool.ruff]
line-length = 100
target-version = "py310"
